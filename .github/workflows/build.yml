name: Unzip and Build APK

# با آپلود/آپدیت فایل زیپ، خودش اکسترکت و بیلد می‌کند
# (بدون داکر؛ Buildozer مستقیم روی رانر نصب می‌شود)
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting: $ZIP_FILE"
          rm -rf src
          mkdir -p src
          unzip -q -o "$ZIP_FILE" -d src
          ls src
          test -f src/buildozer.spec || (echo "ERROR: buildozer.spec not found inside the zip" && exit 1)

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('*.zip') }}
          restore-keys: |
            buildozer-global-v2-

      - name: Verify Android SDK integrity
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -f "$SDK/tools/bin/sdkmanager" ]; then
            echo "Cached SDK is incomplete (no sdkmanager) -> removing for a clean re-download"
            rm -rf "$SDK"
          else
            echo "SDK cache looks OK"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install "cython==0.29.33" buildozer
          buildozer --version

      - name: Pre-accept Android SDK licenses
        # فقط وقتی SDK واقعاً دانلود شده، فایل لایسنس می‌سازیم؛
        # وگرنه خود buildozer دانلود می‌کند و android.accept_sdk_license جواب می‌دهد.
        # (ساخت پوشه خالی قبل از buildozer باعث می‌شد دانلود SDK رد شود!)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK/tools" ]; then
            mkdir -p "$SDK/licenses"
            printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55' > "$SDK/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8' > "$SDK/licenses/android-sdk-preview-license"
            echo "licenses pre-accepted"
          else
            echo "No SDK downloaded yet; buildozer will download it now"
          fi

      - name: Build APK
        working-directory: src
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TahaAiVisualizer-APK
          path: src/bin/*.apk
          if-no-files-found: error
