name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Capacitor project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT="$(find . -type f -name 'capacitor.config.ts' -o -type f -name 'capacitor.config.json' | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT" ] || [ "$PROJECT" = "." ]; then
            if [ -f package.json ]; then
              PROJECT="."
            else
              echo "Capacitor project not found."
              exit 1
            fi
          fi
          echo "Project directory: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Add Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists; skipping cap add."
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TahaAi-Visualizer-Android-debug
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
